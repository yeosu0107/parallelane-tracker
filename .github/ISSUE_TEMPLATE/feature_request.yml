name: Feature request
description: Suggest something ParalleLane should do.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a new request, please search [existing issues](https://github.com/yeosu0107/parallelane-tracker/issues?q=is%3Aissue+label%3Aenhancement) and add a 👍 if it is already there — that is how we gauge demand.
        If it is more of an open-ended idea or a question, [Discussions](https://github.com/yeosu0107/parallelane-tracker/discussions) is the better place.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the feature. What are you doing when you hit this, and what slows you down?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like ParalleLane to do?
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How do you handle this today? (optional)
      description: Terminal commands, another tool, a manual routine — anything.

  - type: dropdown
    id: os
    attributes:
      label: Platform
      multiple: true
      options:
        - macOS
        - Windows
        - Linux (upcoming)
